<title>แนวข้อสอบ วิชาระบบจัดการฐานข้อมูล</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Mitr:wght@400;500&display=swap">
<style>
/* Layout: หน้าเดียวต่อข้อ ตัวเลขข้อใหญ่ทางซ้าย โจทย์ทางขวา แถบความคืบหน้าด้านบน ปุ่มออกสีแดงมุมขวาล่างเฉพาะข้อสุดท้าย */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --fg: #172033;
  --muted: #5b6577;
  --line: #d3dbe6;
  --accent: #1e4fa8;
  --accent-fg: #ffffff;
  --accent-soft: #dce7f9;
  --danger: #d1242f;
  --danger-fg: #ffffff;
  --font-display: "Mitr", "Sarabun", system-ui, sans-serif;
  --font-body: "Sarabun", system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(23,32,51,.06), 0 8px 24px rgba(23,32,51,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1623; --surface: #182234; --fg: #e8edf6; --muted: #9aa6bb; --line: #2b3a54;
    --accent: #7fa8f0; --accent-fg: #0b1220; --accent-soft: #22324f; --danger: #ef4b55; --danger-fg: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1623; --surface: #182234; --fg: #e8edf6; --muted: #9aa6bb; --line: #2b3a54;
  --accent: #7fa8f0; --accent-fg: #0b1220; --accent-soft: #22324f; --danger: #ef4b55; --danger-fg: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 18px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); padding: 28px 24px;
  display: flex; gap: 22px; align-items: flex-start;
}
.num {
  font-family: var(--font-display); font-weight: 500; font-size: 3.4rem; line-height: 1;
  color: var(--accent); min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums;
}
.q { min-width: 0; flex: 1; }
.q .label { font-size: .8rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 0 0 6px; }
.q h2 { font-weight: 600; font-size: 1.45rem; line-height: 1.5; margin: 0; text-wrap: balance; }
.q .hint { margin: 18px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); color: var(--muted); font-size: .95rem; }
.written .q h2 { font-size: 1.15rem; }
.figure { margin: 18px 0 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
.figure img { display: block; width: 100%; height: auto; max-width: 861px; margin: 0 auto; }
nav { display: flex; justify-content: space-between; gap: 12px; }
button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 10px 22px; font-weight: 600; min-height: 46px;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .exit:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.exit {
  position: fixed; z-index: 20;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--danger); color: var(--danger-fg); border: 0; border-radius: 12px;
  padding: 14px 26px; font-weight: 700; font-size: 1.05rem; box-shadow: 0 6px 20px rgba(209,36,47,.4);
}
.bye {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); color: var(--fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  padding: 24px;
}
.bye h2 { font-family: var(--font-display); font-weight: 500; margin: 0; font-size: 1.6rem; }
.bye p { margin: 0; color: var(--muted); }
@media (max-width: 520px) {
  body { font-size: 17px; }
  .card { flex-direction: column; gap: 8px; padding: 22px 18px; }
  .num { text-align: left; font-size: 2.6rem; }
}
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div class="wrap">
  <header>

    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="30" id="bar"><span id="fill"></span></div>

    <button class="btn primary" id="next" type="button">ข้อถัดไป</button>
  </nav>
</div>

</div>

  // สุ่มลำดับใหม่ทุกครั้งที่เปิดหน้า (Fisher-Yates) ข้อสุดท้ายเป็นรูปภาพคงที่
  var order = QUESTIONS.slice();
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = order[i]; order[i] = order[j]; order[j] = t;
  }
  var items = order.map(function (text) { return { text: text }; });
  [
    "จงอธิบายความหมายของฐานข้อมูล (Database) จากความเข้าใจของนักศึกษา",
    "จงยกตัวอย่างโปรแกรมที่ใช้จัดการฐานข้อมูลมา 2 โปรแกรม",
    "Primary Key คืออะไร ใช้กำหนดข้อมูลประเภทไหน"
  ].forEach(function (s) { items.push({ text: s, essay: true }); });
  items.push({ combined: true });
  items.push({ image: true });
  var TOTAL = items.length;
  var idx = 0;

  var card = document.getElementById("card");
  var count = document.getElementById("count");
  var fill = document.getElementById("fill");
  var bar = document.getElementById("bar");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var exit = document.getElementById("exit");
  var bye = document.getElementById("bye");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    var it = items[idx];
    var n = idx + 1;
    if (it.combined) {
      card.className = "card written";
      card.innerHTML =
        '<div class="num">' + n + '</div>' +
        '<div class="q">' +
        '<p class="label">โจทย์รวมข้อ</p>' +
        '<h2>จากรูปตารางข้อมูล ให้นักศึกษาเลือกคำตอบจากกรอบด้านล่าง มาตอบข้อ 100, 101, 102 และ 103</h2>' +
        '<div class="figure"><img src="' + IMG2 + '" alt="ตาราง TblStudent มีข้อ 100 ชื่อตาราง ข้อ 101 หัวคอลัมน์ ข้อ 102 แถวข้อมูล ข้อ 103 กลุ่มของแถวข้อมูล และกรอบตัวเลือก ก. Entity ข. Attribute ค. Tuple ง. Domain จ. Relation"></div>' +
        '</div>';
    } else if (it.essay) {
      card.className = "card written";
      card.innerHTML =
        '<div class="num">' + n + '</div>' +
        '<div class="q">' +
        '<p class="label">ข้อสอบข้อเขียน</p>' +
        '<h2>' + esc(it.text) + '</h2>' +
        '<p class="hint">เตรียมคำตอบด้วยตนเองจากหนังสือเรียน</p>' +
        '</div>';
    } else if (it.image) {
      card.className = "card written";
      card.innerHTML =
        '<div class="num">' + n + '</div>' +
        '<div class="q">' +
        '<p class="label">ข้อสอบข้อเขียน</p>' +
        '<h2>ให้นักศึกษากำหนดข้อมูลดังต่อไปนี้ ลงในตารางข้อมูล Field Name, Data Type, Field Size, Input Mark ให้ถูกต้อง</h2>' +
        '<div class="figure"><img src="' + IMG + '" alt="ตัวอย่างตารางข้อมูล พร้อมรายการ Data Type และตารางสำหรับเติมชื่อฟิลด์ Field Name Data Type Field Size Input Mark"></div>' +
        '</div>';
    } else {
      card.className = "card";
      card.innerHTML =
        '<div class="num">' + n + '</div>' +
        '<div class="q">' +
        '<p class="label">โจทย์</p>' +
        '<h2>' + esc(it.text) + '</h2>' +
        '<p class="hint">ค้นหาคำตอบจากหนังสือเรียน</p>' +
        '</div>';
    }
    count.textContent = "ข้อ " + n + " จาก " + TOTAL;
    fill.style.width = (n / TOTAL * 100) + "%";
    bar.setAttribute("aria-valuenow", n);
    prev.disabled = idx === 0;
    var last = idx === TOTAL - 1;
    next.disabled = last;
    next.hidden = last;
    exit.hidden = !last;
    window.scrollTo(0, 0);
  }

  prev.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
  next.addEventListener("click", function () { if (idx < TOTAL - 1) { idx++; render(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && idx < TOTAL - 1) { idx++; render(); }
    if (e.key === "ArrowLeft" && idx > 0) { idx--; render(); }
  });
  exit.addEventListener("click", function () {
    try { window.close(); } catch (e) {}
    bye.hidden = false;
  });

  render();
})();
